---
- name: Install managed firewall and intrusion prevention packages
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present

- name: Stage effective SSH configuration for validation
  ansible.builtin.copy:
    dest: /run/deploy-sshd-validation.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      Port {{ deploy_ssh_port }}
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
      Include /etc/ssh/sshd_config
  when: hardening_controls.ssh and not ansible_check_mode

- name: Validate staged effective SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -T -f /run/deploy-sshd-validation.conf
  register: staged_sshd
  changed_when: false
  when: hardening_controls.ssh and not ansible_check_mode

- name: Assert staged SSH security controls
  ansible.builtin.assert:
    that:
      - "('port ' ~ (deploy_ssh_port | string)) in staged_sshd.stdout_lines"
      - "'passwordauthentication no' in staged_sshd.stdout_lines"
      - "'kbdinteractiveauthentication no' in staged_sshd.stdout_lines"
      - "'pubkeyauthentication yes' in staged_sshd.stdout_lines"
      # sshd -T prints the legacy alias on OpenSSH 9.6 (Ubuntu 24.04)
      # and the canonical prohibit-password on OpenSSH 10.2 (Ubuntu 26.04).
      - >-
        'permitrootlogin prohibit-password' in staged_sshd.stdout_lines
        or 'permitrootlogin without-password' in staged_sshd.stdout_lines
    quiet: true
  when: hardening_controls.ssh and not ansible_check_mode

- name: Remove obsolete late SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/90-deploy-hardening.conf
    state: absent
  notify: Restart ssh
  when: hardening_controls.ssh

- name: Install early hardened SSH drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-deploy-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      Port {{ deploy_ssh_port }}
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
  notify: Restart ssh
  when: hardening_controls.ssh

- name: Validate installed effective SSH configuration before reload
  ansible.builtin.command: /usr/sbin/sshd -T
  register: effective_sshd
  changed_when: false
  check_mode: false
  when: hardening_controls.ssh and not ansible_check_mode

- name: Assert installed effective SSH security controls
  ansible.builtin.assert:
    that:
      - "('port ' ~ (deploy_ssh_port | string)) in effective_sshd.stdout_lines"
      - "'passwordauthentication no' in effective_sshd.stdout_lines"
      - "'kbdinteractiveauthentication no' in effective_sshd.stdout_lines"
      - "'pubkeyauthentication yes' in effective_sshd.stdout_lines"
      - >-
        'permitrootlogin prohibit-password' in effective_sshd.stdout_lines
        or 'permitrootlogin without-password' in effective_sshd.stdout_lines
    quiet: true
  when: hardening_controls.ssh and not ansible_check_mode

- name: Inspect current effective SSH configuration in check mode
  ansible.builtin.command: /usr/sbin/sshd -T
  register: current_effective_sshd
  changed_when: false
  check_mode: false
  when: hardening_controls.ssh and ansible_check_mode

- name: Apply validated SSH configuration
  ansible.builtin.meta: flush_handlers

- name: Create managed firewall state directory
  ansible.builtin.file:
    path: /var/lib/ansible-deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardening_controls.firewall

- name: Detect current managed firewall policy
  ansible.builtin.stat:
    path: /var/lib/ansible-deploy/firewall-policy
  register: managed_firewall_policy
  when: hardening_controls.firewall

- name: Read current managed firewall policy
  ansible.builtin.slurp:
    path: /var/lib/ansible-deploy/firewall-policy
  register: current_firewall_policy
  when: hardening_controls.firewall and managed_firewall_policy.stat.exists

- name: Reset stale or unmanaged firewall rules
  ansible.builtin.command: ufw --force reset
  when: >-
    hardening_controls.firewall and
    (not managed_firewall_policy.stat.exists or
    (current_firewall_policy.content | b64decode | trim) != (deploy_ssh_port | string))
  changed_when: true

- name: Set incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny
  when: hardening_controls.firewall

- name: Set outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow
  when: hardening_controls.firewall

- name: Allow public service ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["{{ deploy_ssh_port }}", "80", "443"]
  when: hardening_controls.firewall

- name: Enable firewall
  community.general.ufw:
    state: enabled
  when: hardening_controls.firewall

- name: Record managed firewall policy
  ansible.builtin.copy:
    dest: /var/lib/ansible-deploy/firewall-policy
    content: "{{ deploy_ssh_port }}\n"
    owner: root
    group: root
    mode: "0644"
  when: hardening_controls.firewall

- name: Reconnect after firewall activation
  ansible.builtin.meta: reset_connection
  when: hardening_controls.firewall

- name: Verify SSH access after firewall activation
  ansible.builtin.wait_for_connection:
    timeout: 30
  when: hardening_controls.firewall

- name: Verify passwordless sudo after firewall activation
  ansible.builtin.command: sudo -n true
  changed_when: false
  when: hardening_controls.firewall

- name: Disable firewall when explicitly configured off
  community.general.ufw:
    state: disabled
  when: not hardening_controls.firewall

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: hardening_controls.fail2ban

- name: Stop and disable fail2ban when explicitly configured off
  ansible.builtin.service:
    name: fail2ban
    enabled: false
    state: stopped
  when: not hardening_controls.fail2ban
