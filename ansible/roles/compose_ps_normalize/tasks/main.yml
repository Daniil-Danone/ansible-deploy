---
- name: Parse every nonempty Compose ps JSON line
  ansible.builtin.set_fact:
    compose_ps_normalize_values: >-
      {{ compose_ps_normalize_stdout_lines | reject('equalto', '') |
      map('from_json') | list }}

- name: Normalize NDJSON and legacy array-shaped Compose ps output
  ansible.builtin.set_fact:
    compose_service_containers: >-
      {{ compose_ps_normalize_values[0]
      if compose_ps_normalize_values | length == 1 and
      compose_ps_normalize_values[0] is sequence and
      compose_ps_normalize_values[0] is not mapping and
      compose_ps_normalize_values[0] is not string
      else compose_ps_normalize_values }}

- name: Require normalized Compose ps container objects
  ansible.builtin.assert:
    that:
      - compose_service_containers is sequence
      - compose_service_containers is not string
      - >-
        (compose_service_containers | reject('mapping') | list | length) == 0
    fail_msg: "Compose ps output must contain one JSON object per container"
