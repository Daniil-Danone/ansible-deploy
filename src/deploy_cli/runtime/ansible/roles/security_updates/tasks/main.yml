---
- name: Derive automatic security update state
  ansible.builtin.set_fact:
    automatic_security_updates_enabled: >-
      {{ security_updates_enabled and hardening_controls.unattended_upgrades }}

- name: Install unattended upgrades when enabled
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: automatic_security_updates_enabled

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when: automatic_security_updates_enabled

- name: Disable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
  when: not automatic_security_updates_enabled

- name: Remove unattended upgrades when disabled
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
  when: not automatic_security_updates_enabled
