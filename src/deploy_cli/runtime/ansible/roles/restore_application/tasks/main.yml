---
- name: Create Restore application runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/current"

- name: Create Restore deploy user Docker configuration directory
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.docker"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"
  when: app_registry_auth_file | length > 0

- name: Deliver Restore registry authentication securely
  ansible.builtin.copy:
    src: "{{ app_registry_auth_file }}"
    dest: "/home/{{ deploy_user }}/.docker/config.json"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true
  when: app_registry_auth_file | length > 0

- name: Deliver Restore Compose definition
  ansible.builtin.copy:
    src: "{{ app_compose_file }}"
    dest: "{{ app_dir }}/current/compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Deliver Restore environment securely
  ansible.builtin.copy:
    src: "{{ app_env_file }}"
    dest: "{{ app_dir }}/current/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true

- name: Validate and start Restore services without application health gating
  block:
    - name: Validate Restore Compose configuration without rendering secrets
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ app_dir }}/current"
          - --env-file
          - "{{ app_dir }}/current/.env"
          - -f
          - "{{ app_dir }}/current/compose.yml"
          - config
          - --quiet
      become_user: "{{ deploy_user }}"
      become: true
      register: restore_compose_config
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require valid Restore Compose configuration
      ansible.builtin.assert:
        that: restore_compose_config.rc == 0
        fail_msg: >-
          Restore Compose configuration validation failed
          (rc={{ restore_compose_config.rc }})

    - name: Reconcile Restore services for data import
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}/current"
        files: [compose.yml]
        env_files: [.env]
        project_name: "{{ app_compose_project }}"
        pull: always
        state: present
        remove_orphans: true
        wait: false
      become_user: "{{ deploy_user }}"
      become: true
      no_log: true
  rescue:
    - name: Preserve sanitized Restore preparation failure
      ansible.builtin.set_fact:
        restore_preparation_failure: >-
          Restore service preparation failed at {{ ansible_failed_task.name }}
          (rc={{ restore_compose_config.rc | default('unavailable') }})

    - name: Collect Restore preparation diagnostics without masking failure
      block:
        - name: Diagnose failed Restore service preparation
          ansible.builtin.include_role:
            name: compose_diagnostics
          vars:
            compose_diagnostics_dir: "{{ app_dir }}/current"
            compose_diagnostics_project: "{{ app_compose_project }}"
            compose_diagnostics_user: "{{ deploy_user }}"
      rescue:
        - name: Report unavailable secondary Restore diagnostics
          ansible.builtin.debug:
            msg: Secondary Restore diagnostics failed; preserving the original failure

    - name: Preserve Restore service preparation failure
      ansible.builtin.fail:
        msg: "{{ restore_preparation_failure }}"
