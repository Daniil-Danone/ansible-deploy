---
name: Application delivery

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the selected commit to Production after approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY_HOST: ghcr.io
  REGISTRY_PREFIX: ghcr.io/owner

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  image_plan:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      repositories: ${{ steps.plan.outputs.repositories }}
      deployment_sha: ${{ steps.plan.outputs.deployment_sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install PyYAML==6.0.2
      - name: Build complete image matrix from images.yml
        id: plan
        env:
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          python .deploy/ci_image_contract.py plan \
            --project-dir . \
            --registry-prefix "$REGISTRY_PREFIX" \
            --deployment-sha "$DEPLOYMENT_SHA" \
            --github-output "$GITHUB_OUTPUT"

  build_images:
    needs: image_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.image_plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.image_plan.outputs.deployment_sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build, push, and verify service image
        env:
          DEPLOYMENT_SHA: ${{ needs.image_plan.outputs.deployment_sha }}
          SERVICE: ${{ matrix.service }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          if ! printf '%s' "$DEPLOYMENT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            printf '%s\n' 'deployment SHA must be a full lowercase Git SHA' >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$DEPLOYMENT_SHA" ]; then
            printf '%s\n' 'checked-out commit does not match deployment SHA' >&2
            exit 1
          fi
          image_tag="$REPOSITORY:$DEPLOYMENT_SHA"
          docker buildx build \
            --file "$DOCKERFILE" \
            --platform linux/amd64 \
            --push \
            --tag "$image_tag" \
            "$CONTEXT"
          digest="$(
            docker buildx imagetools inspect "$image_tag" --format '{{json .Manifest}}' |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          )"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            printf '%s\n' 'registry returned an invalid image digest' >&2
            exit 1
          fi
          immutable_ref="$REPOSITORY@$digest"
          verified="$(
            docker buildx imagetools inspect "$immutable_ref" --format '{{json .Manifest}}' |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])'
          )"
          if [ "$verified" != "$digest" ]; then
            printf '%s\n' 'immutable registry verification returned a different digest' >&2
            exit 1
          fi
          python .deploy/ci_image_contract.py result \
            --service "$SERVICE" \
            --repository "$REPOSITORY" \
            --digest "$digest" \
            --deployment-sha "$DEPLOYMENT_SHA" \
            --output ".deploy-state/ci-images/$SERVICE.json"
      - name: Upload non-secret immutable image result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-image-${{ matrix.service }}
          path: .deploy-state/ci-images/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 1

  collect_images:
    needs: [image_plan, build_images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deployment_sha: ${{ steps.collect.outputs.deployment_sha }}
      image_map: ${{ steps.collect.outputs.image_map }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.image_plan.outputs.deployment_sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: ci-image-*
          path: .deploy-state/ci-image-results
          merge-multiple: true
      - name: Require one verified result for every configured service
        id: collect
        env:
          DEPLOYMENT_SHA: ${{ needs.image_plan.outputs.deployment_sha }}
          EXPECTED_REPOSITORIES: ${{ needs.image_plan.outputs.repositories }}
        run: |
          python .deploy/ci_image_contract.py collect \
            --expected-repositories-json "$EXPECTED_REPOSITORIES" \
            --deployment-sha "$DEPLOYMENT_SHA" \
            --results-dir .deploy-state/ci-image-results \
            --github-output "$GITHUB_OUTPUT"

  stage:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    needs: [quality, collect_images]
    permissions:
      contents: read
      packages: read
    uses: Daniil-Danone/ansible-deploy/.github/workflows/reusable-deploy.yml@TOOL_FULL_SHA
    with:
      environment: stage
      deployment_sha: ${{ needs.collect_images.outputs.deployment_sha }}
      tool_sha: TOOL_FULL_SHA
      health_url: https://stage.example.com/health
      image_map: ${{ needs.collect_images.outputs.image_map }}

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: [quality, collect_images, stage]
    permissions:
      contents: read
      packages: read
    uses: Daniil-Danone/ansible-deploy/.github/workflows/reusable-deploy.yml@TOOL_FULL_SHA
    with:
      environment: production
      deployment_sha: ${{ needs.collect_images.outputs.deployment_sha }}
      tool_sha: TOOL_FULL_SHA
      health_url: https://example.com/health
      image_map: ${{ needs.collect_images.outputs.image_map }}
