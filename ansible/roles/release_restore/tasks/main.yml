---
- name: Restore original current release pointer
  ansible.builtin.file:
    src: "{{ release_transaction.original_current }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
  when: release_transaction.original_current | length > 0

- name: Restore absent original current release pointer
  ansible.builtin.file:
    path: "{{ app_dir }}/current"
    state: absent
  when: release_transaction.original_current | length == 0

- name: Restore original previous release pointer
  ansible.builtin.file:
    src: "{{ release_transaction.original_previous }}"
    dest: "{{ app_dir }}/previous"
    state: link
    force: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
  when: release_transaction.original_previous | length > 0

- name: Restore absent original previous release pointer
  ansible.builtin.file:
    path: "{{ app_dir }}/previous"
    state: absent
  when: release_transaction.original_previous | length == 0

- name: Restore original current-version metadata
  ansible.builtin.copy:
    dest: "{{ app_dir }}/current-version"
    content: "{{ release_transaction.original_current | basename }}\n"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  when: release_transaction.original_current | length > 0

- name: Restore absent current-version metadata
  ansible.builtin.file:
    path: "{{ app_dir }}/current-version"
    state: absent
  when: release_transaction.original_current | length == 0
