---
- name: Build requested authoritative deployment identity
  ansible.builtin.set_fact:
    requested_deployment_identity:
      compose_project: "{{ app_compose_project }}"
      environment: "{{ app_environment }}"
      nginx_site: "{{ app_nginx_site }}"
      routing:
        domain: "{{ app_domain }}"
        health_path: "{{ health_path }}"
        upstream_port: "{{ app_upstream_port | string }}"
      runtime_dir: "{{ app_dir }}"
  check_mode: false

- name: Inspect authoritative and legacy host identity markers
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ deploy_identity_file }}"
    - "{{ deploy_legacy_identity_file }}"
  register: deployment_identity_files
  check_mode: false

- name: Read authoritative host identity
  ansible.builtin.slurp:
    src: "{{ deploy_identity_file }}"
  register: deployment_identity_raw
  when: deployment_identity_files.results[0].stat.exists
  check_mode: false

- name: Reject any change to authoritative host identity
  ansible.builtin.assert:
    that:
      - (deployment_identity_raw.content | b64decode | from_json) == requested_deployment_identity
    fail_msg: >-
      Host deployment identity differs in environment, runtime, Compose project,
      Nginx site or routing; use a new server or an explicit reset procedure
  when: deployment_identity_files.results[0].stat.exists

- name: Read legacy text host identity
  ansible.builtin.slurp:
    src: "{{ deploy_legacy_identity_file }}"
  register: legacy_identity_raw
  when:
    - not deployment_identity_files.results[0].stat.exists
    - deployment_identity_files.results[1].stat.exists
  check_mode: false

- name: Safely constrain legacy text identity migration
  ansible.builtin.assert:
    that:
      - (legacy_identity_raw.content | b64decode | trim) == app_environment
      - >-
        (app_environment == 'stage' and app_dir == '/srv/myapp'
        and app_compose_project == 'myapp') or
        (app_environment == 'prod' and app_dir == '/srv/myapp-prod'
        and app_compose_project == 'myapp_prod')
    fail_msg: >-
      Legacy host identity cannot prove the requested runtime namespace;
      use the documented reset procedure
  when:
    - not deployment_identity_files.results[0].stat.exists
    - deployment_identity_files.results[1].stat.exists

- name: Inspect committed release routing metadata
  ansible.builtin.stat:
    path: "{{ app_dir }}/current/deployment.json"
  register: committed_release_metadata_file
  check_mode: false

- name: Read committed release routing metadata
  ansible.builtin.slurp:
    src: "{{ app_dir }}/current/deployment.json"
  register: committed_release_metadata_raw
  when: committed_release_metadata_file.stat.exists
  check_mode: false

- name: Decode committed release routing metadata
  ansible.builtin.set_fact:
    committed_release_metadata: >-
      {{ committed_release_metadata_raw.content | b64decode | from_json }}
  when: committed_release_metadata_file.stat.exists
  check_mode: false

- name: Reject routing changes after the first committed release
  ansible.builtin.assert:
    that:
      - committed_release_metadata.routing.domain == app_domain
      - committed_release_metadata.routing.health_path == health_path
      - committed_release_metadata.routing.upstream_port == app_upstream_port
    fail_msg: >-
      Domain, health path and upstream port are immutable after the first release;
      use a new server or an explicit reset procedure
  when: committed_release_metadata_file.stat.exists
