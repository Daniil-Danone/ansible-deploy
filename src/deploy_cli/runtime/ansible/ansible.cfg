[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
timeout = 20
roles_path = roles

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
retries = 5
