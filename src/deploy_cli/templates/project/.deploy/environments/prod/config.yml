---
schema_version: 2
environment: prod
server:
  host: example.com
  ssh_port: 22
  bootstrap_user: root
  deploy_user: deploy
  ssh_key: keys/prod_ed25519
  public_key: keys/prod_ed25519.pub
  host_key_fingerprints: [SHA256:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB]
application:
  compose: deploy/compose.prod.yml
  env_file: environments/prod/app.env
  registry_auth_file: environments/prod/registry-auth.json
  remote_dir: /srv/myapp-prod
  allowed_loopback_ports: [8080]
domain: example.com
acme_email: ops@example.com
health_path: /health
