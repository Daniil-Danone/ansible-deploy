---
- name: Recover application from an unfinished release transaction
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Inspect pending deployment transaction
      ansible.builtin.stat:
        path: "{{ app_dir }}/transaction.json"
      register: pending_transaction_file
      check_mode: false

    - name: Recover pending deployment transaction
      when: pending_transaction_file.stat.exists
      block:
        - name: Read pending deployment transaction
          ansible.builtin.slurp:
            src: "{{ app_dir }}/transaction.json"
          register: pending_transaction

        - name: Decode pending deployment transaction
          ansible.builtin.set_fact:
            release_transaction: "{{ pending_transaction.content | b64decode | from_json }}"

        - name: Restore authoritative committed pointers and metadata
          ansible.builtin.include_role:
            name: release_restore

        - name: Validate recovered Compose configuration safely
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - "{{ app_dir }}/current"
              - -f
              - "{{ app_dir }}/current/compose.yml"
              - -p
              - "{{ app_compose_project }}"
              - config
              - --quiet
          become_user: "{{ deploy_user }}"
          become: true
          changed_when: false
          failed_when: false
          no_log: true
          register: recovered_compose_preflight
          when: release_transaction.original_current | length > 0

        - name: Reject invalid recovered Compose configuration
          ansible.builtin.fail:
            msg: >-
              Recovered Compose configuration validation failed
              (code {{ recovered_compose_preflight.rc }})
          when:
            - release_transaction.original_current | length > 0
            - recovered_compose_preflight.rc != 0

        - name: Reconcile original healthy release without pulling images
          community.docker.docker_compose_v2:
            project_src: "{{ app_dir }}/current"
            files: [compose.yml]
            env_files: [.env]
            project_name: "{{ app_compose_project }}"
            pull: never
            state: present
            remove_orphans: true
            wait: true
            wait_timeout: 120
          become_user: "{{ deploy_user }}"
          become: true
          no_log: true
          register: recovered_compose
          when: release_transaction.original_current | length > 0

        - name: Validate failed candidate Compose configuration safely
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - "{{ release_transaction.candidate }}"
              - -f
              - "{{ release_transaction.candidate }}/compose.yml"
              - -p
              - "{{ app_compose_project }}"
              - config
              - --quiet
          become_user: "{{ deploy_user }}"
          become: true
          changed_when: false
          failed_when: false
          no_log: true
          register: failed_candidate_compose_preflight
          when: release_transaction.original_current | length == 0

        - name: Reject invalid failed candidate Compose configuration
          ansible.builtin.fail:
            msg: >-
              Failed candidate Compose configuration validation failed
              (code {{ failed_candidate_compose_preflight.rc }})
          when:
            - release_transaction.original_current | length == 0
            - failed_candidate_compose_preflight.rc != 0

        - name: Stop failed initial candidate services from permanent release path
          community.docker.docker_compose_v2:
            project_src: "{{ release_transaction.candidate }}"
            files: [compose.yml]
            env_files: [.env]
            project_name: "{{ app_compose_project }}"
            state: absent
          become_user: "{{ deploy_user }}"
          become: true
          no_log: true
          when: release_transaction.original_current | length == 0

        - name: Require every recovered service to be running and healthy
          ansible.builtin.assert:
            that:
              - recovered_compose.containers | length > 0
              - item.State == 'running'
              - (item.Health | default('')) in ['', 'healthy']
            fail_msg: "Recovered Compose service is not running and healthy"
          loop: "{{ recovered_compose.containers | default([]) }}"
          no_log: true
          when: release_transaction.original_current | length > 0

        - name: Verify recovered loopback endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ app_upstream_port }}{{ health_path }}"
            status_code: 200
          register: recovered_loopback_health
          retries: 12
          delay: 5
          until: recovered_loopback_health.status == 200
          when: release_transaction.original_current | length > 0

        - name: Verify recovered public HTTPS endpoint
          ansible.builtin.uri:
            url: "https://{{ app_domain }}{{ health_path }}"
            status_code: 200
            validate_certs: true
          when: release_transaction.original_current | length > 0

        - name: Remove recovered candidate pointer
          ansible.builtin.file:
            path: "{{ app_dir }}/candidate"
            state: absent

        - name: Remove transaction authority only after verified convergence
          ansible.builtin.file:
            path: "{{ app_dir }}/transaction.json"
            state: absent
      rescue:
        - name: Preserve safe release recovery reason
          ansible.builtin.set_fact:
            release_recovery_failure_reason: >-
              {% if ansible_failed_task.name == 'Reject invalid recovered Compose configuration' %}
              {{ ansible_failed_result.msg }}
              {% elif ansible_failed_task.name ==
              'Reject invalid failed candidate Compose configuration' %}
              {{ ansible_failed_result.msg }}
              {% elif ansible_failed_task.name ==
              'Reconcile original healthy release without pulling images' %}
              Recovered Compose daemon reconciliation failed
              {% elif ansible_failed_task.name ==
              'Stop failed initial candidate services from permanent release path' %}
              Failed candidate Compose daemon reconciliation failed
              {% else %}
              Release recovery task failed: {{ ansible_failed_task.name }}
              {% endif %}
            release_recovery_failure_rc: >-
              {% if ansible_failed_task.name == 'Reject invalid recovered Compose configuration' %}
              {{ recovered_compose_preflight.rc }}
              {% elif ansible_failed_task.name ==
              'Reject invalid failed candidate Compose configuration' %}
              {{ failed_candidate_compose_preflight.rc }}
              {% else %}
              {{ ansible_failed_result.rc | default('unknown') }}
              {% endif %}

        - name: Select release recovery diagnostics directory
          ansible.builtin.set_fact:
            release_recovery_diagnostic_dir: >-
              {{ release_transaction.candidate
              if release_transaction is defined
              and release_transaction.original_current | default('') | length == 0
              else app_dir + '/current' }}

        - name: Collect release recovery diagnostics without masking the original failure
          block:
            - name: Diagnose services after failed release recovery
              ansible.builtin.include_role:
                name: compose_diagnostics
              vars:
                compose_diagnostics_dir: "{{ release_recovery_diagnostic_dir }}"
                compose_diagnostics_project: "{{ app_compose_project }}"
                compose_diagnostics_user: "{{ deploy_user }}"
          rescue:
            - name: Report unavailable release recovery diagnostics
              ansible.builtin.debug:
                msg: "Safe release recovery Compose diagnostics are unavailable"

        - name: Preserve release recovery failure
          ansible.builtin.fail:
            msg: >-
              {{ release_recovery_failure_reason | trim }}
              (code {{ release_recovery_failure_rc | trim }});
              safe diagnostics are shown above
