---
schema_version: 2
environment: prod
server:
  host: example.com
  ssh_port: 22
  bootstrap_user: root
  deploy_user: deploy
  ssh_key: keys/prod_ed25519
  public_key: keys/prod_ed25519.pub
  # Filled by `ansible-deploy trust prod`; empty means the host is not trusted yet.
  host_key_fingerprints: []
application:
  compose: deploy/compose.prod.yml
  env_file: environments/prod/app.env
  registry_auth_file: environments/prod/registry-auth.json
  remote_dir: /srv/myapp-prod
  allowed_loopback_ports: [8080]
backup:
  # Enable only after creating these files in the external secret store.
  enabled: false
  schedule: "03:15"
  remote: gdrive:backups/production
  credentials_file: backup/rclone.conf
  age_identity_file: backup/age.key
  age_recipient: age1aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  include:
    - type: directory
      path: /srv/myapp-prod/shared/uploads
      # Relative to the selected environment's application.remote_dir.
      restore_destination: shared/uploads
  retention:
    daily: 7
    weekly: 4
    monthly: 6
domain: example.com
acme_email: ops@example.com
health_path: /health
