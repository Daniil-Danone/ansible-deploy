---
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Refresh deployment account Docker access
  ansible.builtin.include_tasks: access.yml
