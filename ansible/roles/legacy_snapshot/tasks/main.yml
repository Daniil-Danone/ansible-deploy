---
- name: Create immutable legacy release directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}/releases"
    - "{{ app_dir }}/releases/{{ legacy_release_id }}"

- name: Snapshot legacy Compose definition
  ansible.builtin.copy:
    src: "{{ app_dir }}/compose.yml"
    dest: "{{ app_dir }}/releases/{{ legacy_release_id }}/compose.yml"
    remote_src: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Snapshot legacy application environment securely
  ansible.builtin.copy:
    src: "{{ app_dir }}/.env"
    dest: "{{ app_dir }}/releases/{{ legacy_release_id }}/.env"
    remote_src: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true

- name: Snapshot point-1 legacy fixture configuration
  ansible.builtin.copy:
    remote_src: true
    src: "{{ app_dir }}/fixture-nginx.conf"
    dest: "{{ app_dir }}/releases/{{ legacy_release_id }}/fixture-nginx.conf"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Persist immutable legacy release metadata
  ansible.builtin.copy:
    dest: "{{ app_dir }}/releases/{{ legacy_release_id }}/deployment.json"
    content: >-
      {{ {'checksum': legacy_release_checksum, 'environment': app_environment,
      'images': legacy_release_images,
      'routing': {'domain': app_domain, 'health_path': health_path,
      'upstream_port': app_upstream_port}, 'synthetic': true,
      'version': legacy_release_id} | to_nice_json }}
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Commit verified legacy release as current
  ansible.builtin.file:
    src: "{{ app_dir }}/releases/{{ legacy_release_id }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"

- name: Record verified legacy current version
  ansible.builtin.copy:
    dest: "{{ app_dir }}/current-version"
    content: "{{ legacy_release_id }}\n"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
