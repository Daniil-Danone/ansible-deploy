---
- name: Configure Moscow timezone
  community.general.timezone:
    name: Europe/Moscow

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - locales
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
