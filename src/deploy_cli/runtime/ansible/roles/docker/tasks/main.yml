---
- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add deployment account to Docker group
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
