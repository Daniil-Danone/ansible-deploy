---
- name: Prepare and verify rollback candidate without changing committed metadata
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Inspect committed release links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ app_dir }}/current"
        - "{{ app_dir }}/previous"
        - "{{ app_dir }}/transaction.json"
      register: release_links
      check_mode: false

    - name: Require two healthy releases and no unfinished transaction
      ansible.builtin.assert:
        that:
          - release_links.results[0].stat.islnk | default(false)
          - release_links.results[1].stat.islnk | default(false)
          - not release_links.results[2].stat.exists
        fail_msg: "Rollback requires current/previous releases and no unfinished transaction"

    - name: Read committed release targets
      ansible.builtin.command:
        cmd: readlink "{{ item }}"
      loop:
        - "{{ app_dir }}/current"
        - "{{ app_dir }}/previous"
      register: release_targets
      changed_when: false
      check_mode: false

    - name: Persist rollback transaction before candidate activation
      ansible.builtin.copy:
        dest: "{{ app_dir }}/transaction.json"
        content: >-
          {{ {'candidate': release_targets.results[1].stdout,
          'final_previous': release_targets.results[0].stdout,
          'original_current': release_targets.results[0].stdout,
          'original_previous': release_targets.results[1].stdout} | to_nice_json }}
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: Point candidate at previous immutable release
      ansible.builtin.file:
        src: "{{ release_targets.results[1].stdout }}"
        dest: "{{ app_dir }}/candidate"
        state: link
        force: true
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"

    - name: Reconcile rollback candidate with safe failure diagnostics
      block:
        - name: Validate rollback Compose configuration safely
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - "{{ app_dir }}/candidate"
              - -f
              - "{{ app_dir }}/candidate/compose.yml"
              - -p
              - "{{ app_compose_project }}"
              - config
              - --quiet
          become_user: "{{ deploy_user }}"
          become: true
          changed_when: false
          failed_when: false
          no_log: true
          register: rollback_compose_preflight

        - name: Reject invalid rollback Compose configuration
          ansible.builtin.fail:
            msg: >-
              Rollback Compose configuration validation failed
              (code {{ rollback_compose_preflight.rc }})
          when: rollback_compose_preflight.rc != 0

        - name: Reconcile rollback candidate without pulling images
          community.docker.docker_compose_v2:
            project_src: "{{ app_dir }}/candidate"
            files: [compose.yml]
            env_files: [.env]
            project_name: "{{ app_compose_project }}"
            pull: never
            state: present
            remove_orphans: true
            wait: true
            wait_timeout: 120
          become_user: "{{ deploy_user }}"
          become: true
          no_log: true
          register: rollback_compose
      rescue:
        - name: Preserve safe rollback reconciliation reason
          ansible.builtin.set_fact:
            rollback_compose_failure_reason: >-
              {{ ansible_failed_result.msg
              if ansible_failed_task.name == 'Reject invalid rollback Compose configuration'
              else 'Rollback Compose daemon reconciliation failed' }}
            rollback_compose_failure_rc: >-
              {{ rollback_compose_preflight.rc
              if ansible_failed_task.name == 'Reject invalid rollback Compose configuration'
              else ansible_failed_result.rc | default('unknown') }}

        - name: Collect rollback diagnostics without masking the original failure
          block:
            - name: Diagnose failed rollback services
              ansible.builtin.include_role:
                name: compose_diagnostics
              vars:
                compose_diagnostic_dir: "{{ app_dir }}/candidate"
                compose_diagnostic_project: "{{ app_compose_project }}"
                compose_diagnostic_user: "{{ deploy_user }}"
          rescue:
            - name: Report unavailable rollback diagnostics
              ansible.builtin.debug:
                msg: "Safe rollback Compose diagnostics are unavailable"

        - name: Preserve rollback reconciliation failure
          ansible.builtin.fail:
            msg: >-
              {{ rollback_compose_failure_reason }}
              (code {{ rollback_compose_failure_rc }}); safe diagnostics are shown above

    - name: Require every rollback service to be running and healthy
      ansible.builtin.assert:
        that:
          - rollback_compose.containers | length > 0
          - item.State == 'running'
          - (item.Health | default('')) in ['', 'healthy']
        fail_msg: "Rollback Compose service is not running and healthy"
      loop: "{{ rollback_compose.containers }}"
      no_log: true

    - name: Verify rollback loopback endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_upstream_port }}{{ health_path }}"
        status_code: 200
      register: rollback_loopback_health
      retries: 12
      delay: 5
      until: rollback_loopback_health.status == 200

    - name: Verify rollback public HTTPS endpoint
      ansible.builtin.uri:
        url: "https://{{ app_domain }}{{ health_path }}"
        status_code: 200
        validate_certs: true
