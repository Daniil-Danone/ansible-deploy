---
- name: Create deployment identity directory
  ansible.builtin.file:
    path: "{{ deploy_identity_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Persist authoritative host deployment identity
  ansible.builtin.copy:
    dest: "{{ deploy_identity_file }}"
    content: >-
      {{ {'compose_project': app_compose_project, 'environment': app_environment,
      'nginx_site': app_nginx_site,
      'routing': {'domain': app_domain, 'health_path': health_path,
      'upstream_port': app_upstream_port | string}, 'runtime_dir': app_dir} | to_nice_json }}
    owner: root
    group: root
    mode: "0644"

- name: Remove migrated legacy text identity marker
  ansible.builtin.file:
    path: "{{ deploy_legacy_identity_file }}"
    state: absent
