---
- name: Require a portable legacy Compose document
  ansible.builtin.assert:
    that:
      - legacy_compose_definition is mapping
      - legacy_compose_definition.services is mapping
      - legacy_compose_definition.services | length > 0
      - legacy_compose_definition.volumes | default({}) is mapping
      - legacy_compose_definition.configs is not defined
      - legacy_compose_definition.secrets is not defined
      - legacy_compose_definition.include is not defined
      - "'$' not in (legacy_compose_definition | to_json)"
    fail_msg: >-
      Legacy Compose uses interpolation or project-directory-dependent top-level features

- name: Define explicit legacy named volumes
  ansible.builtin.set_fact:
    legacy_declared_volumes: >-
      {{ (legacy_compose_definition.volumes | default({})).keys() | list }}

- name: Require managed legacy named-volume definitions
  ansible.builtin.assert:
    that: legacy_named_volume.value in [none, {}]
    fail_msg: >-
      Legacy named volumes cannot use driver options or project-dependent configuration
  loop: "{{ legacy_compose_definition.volumes | default({}) | dict2items }}"
  loop_control:
    loop_var: legacy_named_volume
    label: "{{ legacy_named_volume.key }}"

- name: Validate every legacy service definition
  ansible.builtin.include_tasks: validate_service.yml
  loop: "{{ legacy_compose_definition.services | dict2items }}"
  loop_control:
    loop_var: legacy_service
    label: "{{ legacy_service.key }}"
