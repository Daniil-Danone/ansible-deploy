---
# Safe acceptance fixture only. Replace with the reviewed application Compose before real Production.
services:
  fixture:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    command:
      - /bin/sh
      - -c
      - >-
        printf '{"status":"ok","environment":"prod"}'
        > /usr/share/nginx/html/health && exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

networks:
  app:
    internal: false
