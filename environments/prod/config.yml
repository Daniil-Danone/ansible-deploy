---
schema_version: 1
environment: prod
server:
  host: 198.51.100.10
  ssh_port: 22
  bootstrap_user: root
  deploy_user: deploy
  ssh_key: ~/.ssh/prod_deploy_ed25519
  public_key: ~/.ssh/prod_deploy_ed25519.pub
  # Obtain out-of-band from the Production provider console.
  host_key_fingerprints:
    - SHA256:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
application:
  compose: environments/prod/docker-compose.yml
  env_file: environments/prod/prod.env
  # Docker config.json rendered locally or from Vault; ignored by Git.
  registry_auth_file: environments/prod/registry-auth.json
  remote_dir: /srv/myapp-prod
  allowed_loopback_ports: [8080]
  required_env_vars: [APP_ENV]
collector:
  push_url: https://grafana.example.com/loki/api/v1/push
  username: alloy
  password_file: environments/prod/collector.password
domain: example.com
acme_email: ops@example.com
health_path: /health
