---
- name: Require portable short-syntax legacy volume
  vars:
    legacy_volume_source: "{{ legacy_volume.split(':', 1)[0] }}"
  ansible.builtin.assert:
    that:
      - legacy_volume is string
      - "':' in legacy_volume"
      - >-
        legacy_volume ==
        './fixture-nginx.conf:/etc/nginx/conf.d/default.conf:ro' or
        (legacy_volume_source.startswith('/') and
        legacy_volume_source in app_allowed_bind_paths) or
        legacy_volume_source in legacy_declared_volumes
    fail_msg: >-
      Legacy service volume must use the known ./fixture-nginx.conf asset,
      an explicitly allowed absolute bind path or a declared named volume
  when: legacy_volume is string

- name: Require portable long-syntax legacy volume
  vars:
    legacy_volume_type: "{{ legacy_volume.type | default('volume') }}"
    legacy_volume_source: "{{ legacy_volume.source | default('') }}"
    legacy_volume_target: "{{ legacy_volume.target | default('') }}"
  ansible.builtin.assert:
    that:
      - legacy_volume_type in ['bind', 'volume']
      - >-
        (legacy_volume_type == 'bind' and
        ((legacy_volume_source == './fixture-nginx.conf' and
        legacy_volume_target == '/etc/nginx/conf.d/default.conf' and
        legacy_volume.read_only | default(false) | bool) or
        (legacy_volume_source.startswith('/') and
        legacy_volume_source in app_allowed_bind_paths))) or
        (legacy_volume_type == 'volume' and
        legacy_volume_source in legacy_declared_volumes)
    fail_msg: >-
      Legacy service volume must use the known ./fixture-nginx.conf asset,
      an explicitly allowed absolute bind path or a declared named volume
  when: legacy_volume is mapping

- name: Reject invalid legacy volume syntax
  ansible.builtin.assert:
    that: legacy_volume is string or legacy_volume is mapping
    fail_msg: "Legacy service volume has invalid syntax"
