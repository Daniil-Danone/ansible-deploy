---
- name: Read pending deployment transaction
  ansible.builtin.slurp:
    src: "{{ app_dir }}/transaction.json"
  register: pending_transaction

- name: Decode pending deployment transaction
  ansible.builtin.set_fact:
    release_transaction: "{{ pending_transaction.content | b64decode | from_json }}"

- name: Commit externally verified current release
  ansible.builtin.file:
    src: "{{ release_transaction.candidate }}"
    dest: "{{ app_dir }}/current"
    state: link
    force: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"

- name: Commit previous healthy release
  ansible.builtin.file:
    src: "{{ release_transaction.final_previous }}"
    dest: "{{ app_dir }}/previous"
    state: link
    force: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
  when: release_transaction.final_previous | length > 0

- name: Keep previous absent after first successful deployment
  ansible.builtin.file:
    path: "{{ app_dir }}/previous"
    state: absent
  when: release_transaction.final_previous | length == 0

- name: Record committed healthy version
  ansible.builtin.copy:
    dest: "{{ app_dir }}/current-version"
    content: "{{ release_transaction.candidate | basename }}\n"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: Remove committed transaction pointers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ app_dir }}/candidate"
    - "{{ app_dir }}/transaction.json"
