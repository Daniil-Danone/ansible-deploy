---
- name: Configure Moscow timezone
  community.general.timezone:
    name: Europe/Moscow

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - locales
    state: present
    # Always refresh: cloud images ship empty apt lists with a fresh mtime,
    # so cache_valid_time would skip the update and find no packages.
    update_cache: true

- name: Generate UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
