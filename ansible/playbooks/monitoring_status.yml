---
- name: Verify monitoring services locally
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify Grafana loopback health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitoring_grafana_port }}/api/health"
        status_code: 200
      register: grafana_health
      retries: 12
      delay: 5
      until: grafana_health.status == 200
    - name: Verify Loki loopback readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitoring_loki_port }}/ready"
        status_code: 200
      register: loki_health
      retries: 12
      delay: 5
      until: loki_health.status == 200
